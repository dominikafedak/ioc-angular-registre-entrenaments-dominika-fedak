<form
  class="filtres"
  #formulariFiltres="ngForm"
  (ngSubmit)="aplicaFiltres()"
  aria-label="Filtres dels entrenaments"
>
  <div class="camp">
    <label for="text">Text de cerca</label>
    <input
      id="text"
      name="text"
      type="search"
      [(ngModel)]="filtres.text"
      #campText="ngModel"
      minlength="3"
      placeholder="Nom o descripció (mínim 3 caràcters)"
      [attr.aria-describedby]="
        campText.invalid && (campText.dirty || campText.touched)
          ? 'text-ajuda text-error'
          : 'text-ajuda'
      "
    />
    @if (campText.invalid && (campText.dirty || campText.touched)) {
      <strong id="text-error" class="error" role="alert">
        La cerca ha de tenir 3 caràcters com a mínim.
      </strong>
    }
  </div>

  <div class="camp">
    <label for="categoria">Categoria</label>
    <select id="categoria" name="categoria" [(ngModel)]="filtres.categoria" required>
      @for (categoria of categories; track categoria) {
        <option [ngValue]="categoria">{{ categoria }}</option>
      }
    </select>
  </div>

  <div class="camp">
    <label for="nivell">Nivell</label>
    <select id="nivell" name="nivell" [(ngModel)]="filtres.nivell">
      @for (nivell of nivells; track nivell) {
        <option [ngValue]="nivell">{{ nivell }}</option>
      }
    </select>
  </div>

  <div class="accions">
    <button type="submit" [disabled]="formulariFiltres.invalid">Aplicar filtres</button>
    <button type="button" class="secundari" (click)="reestableixFiltres()">Restableix</button>
  </div>
</form>
